name: Build CoolBun dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: make

      - name: Show size
        run: ls -lh build/CoolBun.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: CoolBun-dylib
          path: build/CoolBun.dylib
